[project]
name = "comfyui-anima-raffle"
description = "Integrated Anima Style Explorer and ComfyUI-Raffle nodes with artist and character raffle, sex and tag filters, Auto Cycle, and Anima/SD tag formatting."
version = "1.7.0"
dependencies = ["aiohttp"]
authors = [{ name = "fulletlab" }, { name = "rainlizard" }]
maintainers = [{ name = "Ksanadu" }]

[project.urls]
Repository = "https://github.com/Ksanadu/ComfyUI-Anima-Raffle"
"Anima upstream" = "https://github.com/fulletLab/comfyui-anima-style-nodes"
"Raffle upstream" = "https://github.com/rainlizard/ComfyUI-Raffle"

[tool.comfy]
DisplayName = "ComfyUI Anima Raffle"
Icon = "https://raw.githubusercontent.com/Ksanadu/ComfyUI-Anima-Raffle/master/assets/banner.jpg"
